<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#173d43" />
  <title>Harbor · WebGPU Path Tracing</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23173d43'/%3E%3Cpath d='M18 46h28L38 18H26z' fill='%23f3cb88'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="3D playground. WASD to move, Space to jump, E to collect."></canvas>
  <canvas id="trace" tabindex="0" aria-label="Path traced scene. Drag to orbit, scroll to zoom."></canvas>
  <header>
    <div class="identity"><span class="mark">H</span><span>HARBOR<span class="divider"> / </span><small>ENGINE EXAMPLES</small></span></div>
    <div class="actions"><nav class="view-tabs"><button id="play-mode" class="active">Play</button><button id="trace-mode">Path trace</button></nav><label>Quality <select id="quality" aria-label="Quality"><option value="low">Low</option><option value="medium" selected>Balanced</option><option value="high">High</option></select></label><button id="reset" title="Restart">Reset</button></div>
  </header>
  <section class="intro"><h1>Harbor Beacons<span>Collect three beacons.</span></h1><p class="description" id="description">Find the three marked beacons.</p></section>
  <aside class="quest"><div class="quest-heading"><span class="dot"></span>Beacon progress<span id="count">0 / 3</span></div><div id="beacons"></div><p id="quest-note">Approach a beacon and press E.</p></aside>
  <div id="prompt" role="status"></div><div id="trace-caption" class="trace-caption"></div>
  <div id="loading"><span class="loader"></span><strong>Preparing scene</strong><span id="status">Loading scene and physics</span></div>
  <footer><div class="controls"><span><kbd>W A S D</kbd> Move</span><span><kbd>Shift</kbd> Run</span><span><kbd>Space</kbd> Jump</span><span><kbd>E</kbd> Collect</span><span>Drag to look · Scroll to zoom</span></div><button id="diagnostic-toggle" class="diagnostic-toggle">Diagnostics</button></footer>
  <pre id="diagnostics" hidden></pre>
  <div id="joystick" aria-label="Touch movement joystick"><div id="stick"></div></div><div class="touch-actions"><button id="jump">Jump</button><button id="interact">Collect</button></div>
  <script type="module" src="/demo/main.ts"></script>
</body>
</html>
